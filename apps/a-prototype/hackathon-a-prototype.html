<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <title>别鸽了 · 小组作业协作层（A+B 合并版）</title>
  <style>
:root {
  --primary: #4f46e5;
  --primary-dark: #4338ca;
  --primary-soft: #eef2ff;
  --ink: #1f2937;
  --ink-2: #4b5563;
  --ink-3: #6b7280;
  --line: #e5e7eb;
  --bg: #f6f7fb;
  --surface: #ffffff;
  --todo: #6b7280;
  --doing: #2563eb;
  --review: #d97706;
  --done: #059669;
  --danger: #dc2626;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .06);
  --radius: 14px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  color: var(--ink);
  background: #eceff6;
  font-size: 14px;
  line-height: 1.5;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--primary); }

.phone-shell {
  position: relative;
  max-width: 480px;
  min-height: 100vh;
  margin: 0 auto;
  background: var(--bg);
  overflow: hidden;
  box-shadow: 0 0 40px rgba(31, 41, 55, .08);
}
@media (min-width: 520px) {
  .phone-shell { margin: 18px auto; min-height: calc(100vh - 36px); border-radius: 24px; }
}

.app-bar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 56px;
  padding: 0 16px;
  background: rgba(255,255,255,.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.app-bar h1 { font-size: 16px; margin: 0; flex: 1; font-weight: 650; letter-spacing: -.01em; }
.app-bar .sub { font-size: 11px; color: var(--ink-3); font-weight: 400; }
.icon-btn {
  width: 34px; height: 34px; display: grid; place-items: center;
  border: 0; border-radius: 10px; background: var(--bg); color: var(--ink-2); font-size: 17px;
}
.icon-btn:active { transform: scale(.94); }
.screen { padding: 16px; padding-bottom: 88px; }
.screen.flush { padding-bottom: 24px; }

.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  background: linear-gradient(135deg, #6366f1, #4338ca); color: #fff; font-weight: 800; font-size: 18px;
  box-shadow: 0 6px 14px rgba(79,70,229,.28);
}
.brand-text strong { display: block; font-size: 15px; }
.brand-text span { font-size: 11px; color: var(--ink-3); }

.hero { padding: 34px 22px 18px; text-align: center; }
.hero .logo {
  width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 22px;
  background: linear-gradient(135deg, #6366f1, #4338ca); color: #fff;
  display: grid; place-items: center; font-size: 34px; font-weight: 800;
  box-shadow: 0 14px 30px rgba(79,70,229,.3);
}
.hero h1 { font-size: 24px; margin: 0 0 8px; letter-spacing: -.02em; }
.hero p { color: var(--ink-2); margin: 0 0 28px; font-size: 13px; }
.hero .feature-row { display: flex; justify-content: center; gap: 18px; margin-top: 26px; color: var(--ink-3); font-size: 11px; }
.hero .feature-row div { display: flex; flex-direction: column; gap: 5px; align-items: center; }
.hero .feature-row b { font-size: 19px; color: var(--primary); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 42px; padding: 0 16px; border: 0; border-radius: 12px;
  background: var(--primary); color: #fff; font-weight: 600; font-size: 14px;
  transition: transform .1s, background .15s;
}
.btn:active { transform: scale(.98); }
.btn:hover { background: var(--primary-dark); }
.btn.block { width: 100%; }
.btn.ghost { background: #fff; color: var(--primary); border: 1px solid #c7d2fe; }
.btn.ghost:hover { background: var(--primary-soft); }
.btn.plain { background: var(--bg); color: var(--ink-2); }
.btn.plain:hover { background: #e5e7eb; }
.btn.danger { background: #fee2e2; color: var(--danger); }
.btn.danger:hover { background: #fecaca; }
.btn.sm { min-height: 32px; padding: 0 11px; font-size: 12px; border-radius: 9px; }
.btn.xs { min-height: 27px; padding: 0 9px; font-size: 11px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-row { display: flex; gap: 10px; }
.btn-row > .btn { flex: 1; }

.card {
  background: var(--surface); border-radius: var(--radius); padding: 16px;
  box-shadow: var(--shadow); border: 1px solid rgba(229,231,235,.7); margin-bottom: 12px;
}
.card.tight { padding: 13px; }
.section-title { display: flex; align-items: center; justify-content: space-between; margin: 20px 2px 10px; }
.section-title h2 { font-size: 14px; margin: 0; font-weight: 650; }
.link { color: var(--primary); font-size: 12px; background: none; border: 0; padding: 2px 0; font-weight: 600; }
.link:active { opacity: .7; }
.muted { color: var(--ink-3); font-size: 12px; }
.empty { text-align: center; color: var(--ink-3); padding: 34px 10px; font-size: 13px; }
.empty .big { font-size: 30px; display: block; margin-bottom: 8px; opacity: .5; }

.group-card { display: flex; align-items: center; gap: 12px; }
.group-avatar {
  width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center;
  color: #fff; font-weight: 700; font-size: 17px; flex: none;
}
.group-card .meta { flex: 1; min-width: 0; }
.group-card .meta strong { display: block; font-size: 14px; margin-bottom: 3px; }
.group-card .meta span { color: var(--ink-3); font-size: 11px; }
.group-card .del-x { width: 28px; height: 28px; flex: none; font-size: 15px; background: transparent; color: var(--ink-3); }
.group-card .del-x:hover { background: #fef2f2; color: var(--danger); }
.danger-zone { border-color: #fecaca; background: #fffbfb; }
.danger-zone .block-title > span:first-child { color: var(--danger); }
.del-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.del-fact { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 6px; text-align: center; }
.del-fact b { display: block; font-size: 17px; line-height: 1.2; color: var(--ink); }
.del-fact span { font-size: 11px; color: var(--ink-3); }
.del-warn { background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 9px 11px; font-size: 12px; line-height: 1.55; color: #b91c1c; margin: 0 0 10px; }
.del-note { font-size: 12px; color: var(--ink-2); line-height: 1.55; margin: 0 0 10px; }

.avatar {
  width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center;
  color: #fff; font-size: 11px; font-weight: 600; flex: none; border: 2px solid #fff;
}
.avatar.sm { width: 22px; height: 22px; font-size: 11px; }
.avatar-stack { display: flex; }
.avatar-stack .avatar + .avatar { margin-left: -7px; }

.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.stat {
  background: #fff; border: 1px solid rgba(229,231,235,.8); border-radius: 12px;
  padding: 11px 8px; text-align: center; box-shadow: var(--shadow);
}
.stat b { display: block; font-size: 19px; line-height: 1.2; color: var(--ink); }
.stat span { font-size: 11px; color: var(--ink-3); }

.tabs { display: flex; gap: 4px; background: #eaeef5; padding: 4px; border-radius: 12px; margin-bottom: 14px; }
.tabs button {
  flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 9px;
  font-size: 12px; color: var(--ink-2); font-weight: 500; white-space: nowrap;
}
.tabs button.active { background: #fff; color: var(--primary); font-weight: 650; box-shadow: 0 1px 4px rgba(16,24,40,.08); }

.board {
  display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px;
  scroll-snap-type: x mandatory; margin: 0 -16px; padding: 0 16px 8px;
}
.board::-webkit-scrollbar { height: 5px; }
.board::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
.board-col {
  flex: 0 0 252px; scroll-snap-align: start; background: #eff1f6;
  border-radius: 14px; padding: 10px; min-height: 240px;
}
.board-col-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 10px; }
.board-col-head strong { font-size: 12px; display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.count { background: #fff; color: var(--ink-3); border-radius: 20px; padding: 1px 7px; font-size: 11px; }
.task-card {
  background: #fff; border: 1px solid var(--line); border-radius: 11px; padding: 11px;
  margin-bottom: 8px; box-shadow: 0 1px 2px rgba(16,24,40,.04); cursor: pointer;
}
.task-card:active { background: #fafaff; }
.task-card.unclaimed { border-color: #c7d2fe; background: #fafaff; }
.task-card .title { font-weight: 600; font-size: 13px; margin-bottom: 7px; line-height: 1.35; }
.task-card .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.task-card .due { font-size: 11px; color: var(--ink-3); }
.task-card .due.overdue { color: var(--danger); font-weight: 600; }
.tag {
  display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 6px;
  font-size: 11px; font-weight: 600; background: var(--bg); color: var(--ink-2);
}
.tag.rejected { background: #fee2e2; color: var(--danger); }
.tag.claimed { background: #e0e7ff; color: var(--primary); }
.tag.version { background: #f3f4f6; color: var(--ink-3); }
.mini-claim { margin-top: 9px; width: 100%; }

.review-item { border-left: 3px solid var(--review); }
.review-item .reject-reason { color: var(--danger); font-size: 11px; margin: 6px 0 0; }

.field { margin-bottom: 13px; }
.field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--ink-2); }
.field input, .field textarea, .field select {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  background: #fff; outline: none; font-size: 16px;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.field textarea { min-height: 80px; resize: vertical; }
.field .hint { font-size: 11px; color: var(--ink-3); margin-top: 5px; }
.inline-fields { display: flex; gap: 10px; }
.inline-fields .field { flex: 1; }

.req-tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-size: 11px; font-weight: 700; }
.count-stepper { display: flex; align-items: stretch; gap: 8px; }
.count-stepper input { flex: 1; min-width: 0; text-align: center; font-size: 20px; font-weight: 700; color: var(--ink); }
.count-stepper .step { width: 46px; flex: none; cursor: pointer; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink-2); font-size: 19px; font-weight: 700; line-height: 1; }
.count-stepper .step:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.count-stepper .step:disabled { opacity: .35; cursor: not-allowed; }
.count-chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.count-chip { cursor: pointer; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 11px; font-size: 11px; color: var(--ink-2); }
.count-chip:hover { border-color: var(--primary); color: var(--primary); }
.count-chip.on { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); font-weight: 700; }
.count-preview { margin-top: 8px; font-size: 11px; line-height: 1.55; color: var(--ink-2); background: var(--bg); border: 1px dashed var(--line); border-radius: 9px; padding: 7px 10px; }
.count-preview b { color: var(--primary); font-size: 13px; }
.count-preview.bad { border-color: #fecaca; background: #fef2f2; color: var(--danger); }
.count-preview.bad b { color: var(--danger); }

/* ---- 注册 / 登录页 ---- */
.auth-card { padding: 17px; }
.auth-foot { text-align: center; font-size: 11px; color: var(--ink-3); margin: 11px 0 0; line-height: 1.6; }

/* ---- 贡献页签（逐人任务与交付） ---- */
.contrib-head { display: flex; align-items: center; gap: 9px; }
.contrib-head .avatar { flex: none; }
.contrib-stats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.contrib-stats b { color: var(--ink); font-size: 11.5px; }
.contrib-bar { height: 7px; border-radius: 999px; background: #eef0f5; overflow: hidden; display: flex; }
.contrib-bar span { height: 100%; }
.contrib-task { padding: 10px 0; border-bottom: 1px solid #f1f2f5; cursor: pointer; }
.contrib-task:last-child { border-bottom: 0; }
.contrib-task .ct-title { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; }
.contrib-task .ct-title > span:nth-child(2) { flex: 1; min-width: 0; word-break: break-word; }
.contrib-task .ct-desc { font-size: 11px; color: var(--ink-2); margin: 5px 0 0; white-space: pre-wrap; word-break: break-word; }
.contrib-task .ct-spec { font-size: 11px; color: var(--ink-3); margin: 3px 0 0; word-break: break-word; }
.contrib-task .ct-deliver { margin-top: 7px; }
.contrib-task .ct-deliver .deliverable { margin: 0; }
.contrib-task .ct-none { font-size: 11px; color: var(--ink-3); margin-top: 5px; }
.contrib-task .st { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; flex: none; white-space: nowrap; }
.contrib-task .st.done { background: #ecfdf5; color: var(--done); }
.contrib-task .st.review { background: #fffbeb; color: var(--review); }
.contrib-task .st.doing { background: #eff6ff; color: var(--doing); }
.contrib-task .st.todo { background: #f3f4f6; color: var(--todo); }
.contrib-task .st.unclaimed { background: #f5f3ff; color: #8b5cf6; }
.contrib-task .st.overdue { background: #fef2f2; color: var(--danger); }

.overlay {
  position: fixed; inset: 0; z-index: 60; background: rgba(17,24,39,.42);
  display: flex; justify-content: center; align-items: flex-end;
  animation: fade .16s ease-out;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet, .dialog {
  background: #fff; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
  border-radius: 20px 20px 0 0; padding: 18px 18px 26px;
  animation: slideUp .2s ease-out;
}
.dialog { align-self: center; border-radius: 18px; max-width: 400px; margin: 16px; padding-bottom: 18px; }
@keyframes slideUp { from { transform: translateY(26px); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
.sheet-head h2 { margin: 0; font-size: 17px; }
.sheet-head .sub { font-size: 11px; color: var(--ink-3); margin-top: 3px; }
.close-x { border: 0; background: var(--bg); width: 28px; height: 28px; border-radius: 50%; color: var(--ink-2); font-size: 15px; }

.detail-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
.detail-desc { font-size: 12px; color: var(--ink-2); background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
.divider { height: 1px; background: var(--line); margin: 16px 0; }
.block-title { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 650; margin: 0 0 10px; }

.deliverable {
  display: flex; align-items: center; gap: 9px; padding: 9px 10px; border: 1px solid var(--line);
  border-radius: 10px; margin-bottom: 7px; font-size: 12px;
}
.deliverable .favicon {
  width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  background: var(--primary-soft); color: var(--primary); font-size: 12px; font-weight: 700; flex: none;
}
.deliverable .info { flex: 1; min-width: 0; }
.deliverable .info strong { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deliverable .info span { font-size: 11px; color: var(--ink-3); }
.deliverable old { text-decoration: line-through; opacity: .5; }

.comment { display: flex; gap: 8px; margin-bottom: 12px; }
.comment .body { flex: 1; background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.comment .body .head { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--ink-3); margin-bottom: 3px; }
.comment .body .head b { color: var(--ink); font-size: 12px; }
.comment .body p { margin: 0; font-size: 12px; word-break: break-word; }
.comment .mention { color: var(--primary); font-weight: 600; }
.comment-edit { width: 100%; border: 1px solid var(--primary); border-radius: 8px; padding: 7px; font-size: 12px; }
.mention-bar { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 7px; }
.mention-bar button { border: 1px solid var(--line); background: #fff; border-radius: 20px; padding: 3px 9px; font-size: 11px; color: var(--ink-2); }
.mention-bar button:active { background: var(--primary-soft); color: var(--primary); }

.action-bar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 25; display: flex; gap: 8px;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  background: rgba(255,255,255,.94); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
}
.action-bar .btn { flex: 1; min-height: 40px; }

.event-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid #f1f2f5; }
.event-item:last-child { border-bottom: 0; }
.event-item .ev-icon {
  width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center;
  background: var(--primary-soft); color: var(--primary); font-size: 13px; flex: none;
}
.event-item .ev-body { flex: 1; min-width: 0; }
.event-item .ev-body b { font-size: 12px; }
.event-item .ev-body div { font-size: 11px; color: var(--ink-3); word-break: break-all; }
.event-item time { font-size: 11px; color: var(--ink-3); white-space: nowrap; }

.snapshot-banner {
  background: linear-gradient(135deg, #ecfdf5, #f0fdf4); border: 1px solid #a7f3d0;
  border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
}
.snapshot-banner strong { color: #047857; font-size: 13px; }
.snapshot-banner p { margin: 4px 0 0; font-size: 11px; color: #047857; opacity: .85; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; font-size: 12px; border-bottom: 1px solid #f1f2f5; }
.kv:last-child { border-bottom: 0; }
.kv span:first-child { color: var(--ink-3); flex: none; }
.kv span:last-child { text-align: right; word-break: break-all; }
.verify-ok { color: var(--done); font-weight: 600; }

.toast-root { position: fixed; bottom: 86px; left: 0; right: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast {
  background: rgba(31,41,55,.94); color: #fff; padding: 9px 15px; border-radius: 20px;
  font-size: 12px; box-shadow: 0 8px 20px rgba(0,0,0,.16); animation: toastIn .18s ease-out;
  max-width: 86%; text-align: center;
}
.toast.error { background: #b91c1c; }
.toast.success { background: #047857; }
@keyframes toastIn { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.code-box {
  display: flex; align-items: center; justify-content: space-between; background: var(--primary-soft);
  border: 1px dashed #a5b4fc; border-radius: 12px; padding: 12px 14px; margin: 10px 0;
}
.code-box b { font-size: 22px; letter-spacing: .18em; color: var(--primary); }
.pending-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.pending-row:last-child { border-bottom: 0; }
.pending-row .who { flex: 1; font-size: 12px; }
.user-switch { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; }
.user-switch button {
  flex: none; border: 1px solid var(--line); background: #fff; border-radius: 20px;
  padding: 5px 10px 5px 5px; display: flex; align-items: center; gap: 6px; font-size: 11px;
}
.user-switch button.active { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); font-weight: 600; }
kbd { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 11px; }

/* ---- B 线功能（模板/AI 拆解/DDL 倒推/提醒/订阅/黄牌）并入后的新增样式 ---- */
.icon-btn { position: relative; }
.nbadge {
  position: absolute; top: -4px; right: -5px; min-width: 15px; height: 15px; padding: 0 4px;
  background: var(--danger); color: #fff; border-radius: 9px; font-size: 10px; font-weight: 700;
  display: grid; place-items: center; border: 1.5px solid #fff;
}
.asg-bar { display: flex; gap: 8px; align-items: center; }
.asg-bar select {
  flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; background: #fff; font-size: 13px;
}
.ntype { display: inline-flex; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; flex: none; }
.ntype.reminder { background: #e0e7ff; color: var(--primary); }
.ntype.mention { background: #dbeafe; color: #2563eb; }
.ntype.comment { background: #dcfce7; color: #15803d; }
.ntype.reject { background: #fee2e2; color: var(--danger); }
.ntype.auto_assign { background: #fef3c7; color: #b45309; }
.ntype.yellow_card_self, .ntype.yellow_card_leader { background: #fef9c3; color: #a16207; }
.note-card.read { opacity: .62; }
.note-card .note-body { font-size: 12px; color: var(--ink-2); margin: 7px 0; word-break: break-word; }
.note-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.tl-list { list-style: none; margin: 0; padding: 0; }
.tl-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid #f1f2f5; }
.tl-item:last-child { border-bottom: 0; }
.tl-item .tl-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex: none; background: var(--done); }
.tl-item.h24 .tl-dot { background: var(--danger); }
.tl-item.h48 .tl-dot { background: var(--review); }
.tl-item.overdue .tl-dot { background: var(--danger); box-shadow: 0 0 0 3px #fee2e2; }
.tl-item .tl-name { font-size: 13px; font-weight: 600; }
.tl-item.overdue .tl-name { color: var(--danger); }
.phase-tag { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; margin-left: 6px; }
.phase-tag.future { background: #ecfdf5; color: var(--done); }
.phase-tag.h48 { background: #fffbeb; color: var(--review); }
.phase-tag.h24, .phase-tag.overdue { background: #fef2f2; color: var(--danger); }
.job-status { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; }
.job-status.pending { background: var(--bg); color: var(--ink-2); }
.job-status.sent { background: #ecfdf5; color: var(--done); }
.job-status.failed { background: #fef2f2; color: var(--danger); }

.draft-task { border: 1px solid var(--line); border-radius: 11px; padding: 11px; margin-bottom: 10px; background: #fff; }
.draft-task .key { font-size: 11px; color: var(--ink-3); margin-bottom: 6px; }
.draft-task .field { margin-bottom: 8px; }
.draft-task .field label { font-size: 11px; margin-bottom: 3px; }
.draft-task .field input, .draft-task .field select { padding: 7px 9px; font-size: 12px; }
.ms-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.ms-row input[type="text"] { flex: 1.2; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 12px; }
.ms-row input[type="datetime-local"] { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 7px 6px; font-size: 11px; }
.ms-row .icon-btn { width: 28px; height: 28px; font-size: 12px; flex: none; }
/* iOS 聚焦 <16px 输入框会自动放大页面；紧凑编辑行仅在手机宽度下提升到 16px，桌面保留原密度 */
@media (max-width: 520px) {
  .draft-task .field input, .draft-task .field select,
  .ms-row input[type="text"], .ms-row input[type="datetime-local"] { font-size: 16px; }
}
/* 触屏设备把高频点按目标放大到约 40px，减少误触；鼠标设备保持原有紧凑布局 */
@media (pointer: coarse) {
  .icon-btn { width: 40px; height: 40px; }
  .close-x { width: 40px; height: 40px; }
  .tabs button { min-height: 40px; }
  .btn.sm { min-height: 38px; }
  .ms-row .icon-btn { width: 36px; height: 36px; }
  .mention-bar button { min-height: 32px; padding: 5px 11px; }
}
/* 键盘导航时显示清晰焦点环；鼠标点击不出现，避免干扰视觉 */
.btn:focus-visible, .icon-btn:focus-visible, .tabs button:focus-visible,
.link:focus-visible, .close-x:focus-visible, .group-card:focus-visible,
.task-card:focus-visible, .contrib-task:focus-visible,
.count-stepper .step:focus-visible, .mention-bar button:focus-visible {
  outline: 2px solid var(--primary); outline-offset: 2px;
}
.sheet:focus, .dialog:focus { outline: none; }
.errors-box {
  background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; border-radius: 10px;
  padding: 10px 12px; font-size: 12px; margin-bottom: 12px; white-space: pre-line; word-break: break-all;
}
.chk { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 7px 0; }
.chk input { width: 16px; height: 16px; accent-color: var(--primary); }
.b-offline { background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 10px 12px; font-size: 12px; color: #92400e; margin-bottom: 12px; }

</style>
</head>
<body>
  <div class="phone-shell">
    <div id="app"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <div id="modal-root"></div>
  </div>
  <script>
/* 别鸽了 · 小组作业协作层（A+B 合并版，单文件完整作品）
 * A 线：F1 登录 / F2 建组邀请 / F9 看板认领 / F12 交付物 / F13 评论 / F21 审核 / F22 统一提交
 * B 线（并入 A）：F5 模板 / F6 AI 拆解 / F7 DDL 倒推 / F16 提醒 / F17 微信订阅 / F19 黄牌
 * 数据层：A/C 契约走 mock API（默认 127.0.0.1:8787，?api= 可改）；
 *         B 功能直连真 b-time 服务（默认 127.0.0.1:8788，?b= 可改）。
 * 运行：终端 1 `cd e2e && npm run mock`；终端 2 `cd services/b-time && npm start`；浏览器打开本文件。
 * 前端只留一份内存缓存，不落 localStorage 业务数据；跨标签页同步由轮询承担（原型没有 WebSocket 通道）。
 */
(() => {
  'use strict';

  const PARAMS = new URLSearchParams(location.search);
  const API = PARAMS.get('api') || 'http://127.0.0.1:8787';
  const B_API = PARAMS.get('b') || 'http://127.0.0.1:8788';
  const SESSION_KEY = 'hackathon_a_session';
  const $ = (sel) => document.querySelector(sel);
  const STATUS = {
    unclaimed: '未认领', todo: '待办', doing: '进行中', review: '待审核', done: '已完成'
  };
  const STATUS_COLOR = { unclaimed: '#8b5cf6', todo: '#6b7280', doing: '#2563eb', review: '#d97706', done: '#059669' };
  // 冻结 Event schema v1 的 18 类。真源 = packages/contracts/event.v1.schema.json；
  // 本文件以 file:// 自包含打开，不能跨源 import JSON，故保留标签副本，
  // 由 e2e/contracts.test.js 断言键集合与真源 enum 逐字一致。
  // 原型旧标签 task_claim / review_approve / group_create / invite_create 等不在冻结表内，已弃用。
  const TYPE_LABEL = {
    member_join: '成员加入', member_exit: '成员退出', claim: '认领任务', reassign: '转派任务',
    start: '开始任务', submit: '提交审核', reject: '审核打回', approve: '审核通过',
    comment: '新增评论', deliverable_update: '提交成果', ddl_change: '截止时间变更',
    final_submit: '最终提交', review_submit: '提交互评', yellow_card: '逾期提醒',
    dispute_open: '发起申诉', dispute_resolve: '申诉裁定', contribution_adjust: '贡献调整',
    report_export: '报告导出'
  };
  const EV_ICON = { approve: '✓', reject: '✓', review_submit: '✓', comment: '◌', deliverable_update: '↗' };

  function emptyState() {
    return {
      users: [], groups: [], members: [], invites: [], assignments: [], tasks: [],
      deliverables: [], comments: [], events: [], pendingJoins: [], finalSubmissions: [], session: null
    };
  }

  let state = emptyState();
  // B 侧（真 b-time）数据独立成块：B 服务掉线只降级 B 功能，不影响 A 主链路。
  const bEmpty = () => ({ online: null, unread: 0, notifications: [], templates: null, quota: null, milestones: null, jobs: [], cards: [] });
  let bState = bEmpty();
  let token = null;
  const ui = { view: 'login', groupId: null, tab: 'board', taskId: null, assignmentId: null, unreadOnly: false, authMode: 'login' };
  let modal = null;
  // 登录/注册表单的暂存值：切换登录↔注册不丢已填邮箱与昵称（验证码不暂存）。
  let authForm = { email: '', name: '' };
  // 建作业向导与草稿确认页的本地编辑态（绑定 input 事件直写对象，轮询不重渲染这两个视图）
  let wiz = null;
  let draft = null, draftId = null, draftErrors = [];
  let emailCooldownUntil = 0;
  let apiError = '';
  let busy = false;

  /* ---------------- API 数据层 ---------------- */
  async function api(method, path, body) {
    const res = await fetch(API + path, {
      method,
      headers: { 'content-type': 'application/json', ...(token ? { authorization: 'Bearer ' + token } : {}) },
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    let data = null;
    try { data = await res.json(); } catch (_) { /* 空响应体 */ }
    if (!res.ok) {
      const err = new Error((data && data.error) || ('HTTP ' + res.status));
      err.status = res.status;
      throw err;
    }
    return data;
  }

  // B 直连：会话与 A 共用同一 mock token（b-time parseSession 兼容解析）。
  // 返回 { data, headers }——AI 降级/缓存标记走响应头（TaskDraft v1 body 保持纯契约形状）。
  async function bApi(method, path, body) {
    const res = await fetch(B_API + path, {
      method,
      headers: { 'content-type': 'application/json', ...(token ? { authorization: 'Bearer ' + token } : {}) },
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    let data = null;
    try { data = await res.json(); } catch (_) { /* 空响应体 */ }
    if (!res.ok) {
      const err = new Error((data && data.error) || ('HTTP ' + res.status));
      err.status = res.status;
      err.body = data;
      throw err;
    }
    return { data, headers: res.headers };
  }

  function saveSession() {
    try {
      if (token && state.session) localStorage.setItem(SESSION_KEY, JSON.stringify({ token, userId: state.session }));
      else localStorage.removeItem(SESSION_KEY);
    } catch (_) { /* 隐私模式下 localStorage 不可用，退化为仅内存会话 */ }
  }

  async function login(code) {
    const r = await api('POST', '/v1/auth/wechat-login', { code });
    token = r.token;
    state.session = r.userId;
    saveSession();
  }

  function dropSession() {
    const users = state.users;
    token = null;
    state = emptyState();
    state.users = users;
    bState = bEmpty();
    saveSession();
  }

  // mock 的 todo 含「未认领 / 待办」两态，in_progress 即原型的 doing；只在视图侧还原，不改服务端词表。
  const toViewStatus = (t) => (t.status === 'todo' && !t.assigneeId ? 'unclaimed' : t.status === 'in_progress' ? 'doing' : t.status);

  function taskFromFull(raw, groupId, assignmentId) {
    const prev = state.tasks.find((t) => t.id === raw.id);
    const version = raw.deliverables.length ? Math.max(...raw.deliverables.map((d) => d.version)) : 0;
    return {
      id: raw.id, groupId, assignmentId, key: raw.key, title: raw.title,
      status: toViewStatus(raw), assigneeId: raw.assigneeId, due: raw.due,
      estimatedLoad: raw.estimatedLoad, version,
      // 服务端的 rejected 是「曾被打回」的留痕，通过后不清；视图上已完成的卡片不该再挂打回标。
      rejected: !!raw.rejected && raw.status !== 'done',
      description: prev ? prev.description : '',
      deliverableSpec: prev ? prev.deliverableSpec : '',
      dependsOn: prev ? prev.dependsOn : [],
      rejectReason: raw.status === 'done' ? null : (prev ? prev.rejectReason : null)
    };
  }

  function eventFromLedger(e, groupId) {
    const ref = e.objectRef || {};
    const tid = ref.kind === 'task' ? ref.id : ((e.payload && e.payload.taskId) || null);
    return {
      id: e.eventId, type: e.type, actorId: e.actorId, groupId: e.groupId || groupId,
      taskId: tid, ts: Date.parse(e.occurredAt), payload: e.payload || {}
    };
  }

  function finalFromApi(s) {
    return {
      id: s.id, groupId: s.groupId, assignmentId: s.assignmentId,
      submittedBy: s.submittedBy, createdAt: Date.parse(s.submittedAt),
      reason: s.reason || null, forced: !!s.forced,
      snapshot: {
        tasks: (s.tasks || []).map((t) => ({
          id: t.id, title: t.title, status: toViewStatus(t),
          assignee: t.assigneeId || null, deliverable: t.latestDeliverable || null
        }))
      }
    };
  }

  const commentFromApi = (c) => ({ ...c, createdAt: Date.parse(c.createdAt), editedAt: c.editedAt ? Date.parse(c.editedAt) : null });

  // 一次刷新拉齐当前身份可见的全部数据；ui / modal 不受影响。
  async function refresh() {
    const dir = await api('GET', '/v1/users');
    state.users = dir.users;
    if (!state.session) return;

    const mine = await api('GET', '/v1/groups');
    const groups = [], members = [], invites = [], assignments = [];
    const tasks = [], deliverables = [], events = [], finals = [], pending = [];
    const seenEvents = new Set();

    for (const g of mine.groups) {
      const detail = await api('GET', '/v1/groups/' + g.id);
      groups.push({
        id: g.id, name: detail.name, course: detail.course ?? null,
        color: detail.color || g.color || '#6366f1', ownerId: detail.ownerId,
        memberLimit: detail.memberLimit ?? 8, joinNeedConfirm: !!detail.joinNeedConfirm
      });
      for (const id of detail.members) {
        members.push({ groupId: g.id, userId: id, role: id === detail.ownerId ? 'leader' : 'member', joinedAt: 0 });
      }
      const inv = await api('GET', `/v1/groups/${g.id}/invites`);
      for (const i of inv.invites) {
        invites.push({ code: i.code, groupId: g.id, expiresAt: Date.parse(i.expiresAt), createdBy: i.createdBy, active: !!i.active });
      }
      if (detail.ownerId === state.session) {
        const jr = await api('GET', `/v1/groups/${g.id}/join-requests`);
        for (const p of jr.requests) {
          pending.push({ groupId: g.id, userId: p.userId, code: p.code, ts: p.ts ? Date.parse(p.ts) : null });
        }
      }
      const asg = await api('GET', `/v1/groups/${g.id}/assignments`);
      for (const a of asg.assignments) {
        assignments.push({
          id: a.id, groupId: g.id, title: a.title, finalDdl: a.finalDdl,
          course: detail.course ?? null, requirements: '', rubric: null
        });
        const full = await api('GET', `/v1/internal/assignments/${a.id}/tasks-full`);
        for (const raw of full.tasks) {
          tasks.push(taskFromFull(raw, g.id, a.id));
          for (const d of raw.deliverables) deliverables.push({ ...d, createdAt: Date.parse(d.createdAt) });
        }
        const tl = await api('GET', `/v1/assignments/${a.id}/timeline`);
        for (const e of tl.events) {
          if (seenEvents.has(e.eventId)) continue;
          seenEvents.add(e.eventId);
          events.push(eventFromLedger(e, g.id));
        }
        const fs = await api('GET', `/v1/assignments/${a.id}/final-submissions`);
        for (const s of fs.submissions) finals.push(finalFromApi(s));
      }
    }

    const myReq = await api('GET', '/v1/join-requests/mine');
    for (const p of myReq.requests) {
      pending.push({ groupId: p.groupId, groupName: p.groupName, userId: p.userId, code: p.code, ts: p.ts ? Date.parse(p.ts) : null });
    }

    state.groups = groups;
    state.members = members;
    state.invites = invites;
    state.assignments = assignments;
    state.tasks = tasks;
    state.deliverables = deliverables;
    state.events = events;
    state.pendingJoins = pending;
    // 提交历史按时间倒序：贡献页的 renderSnapshot 用 find 取「最新一条」。
    state.finalSubmissions = finals.sort((a, b) => b.createdAt - a.createdAt);

    // 评论按任务懒加载，刷新时只重取当前打开的那条任务，避免 N+1。
    if (modal && modal.type === 'task') await loadTaskDetail(modal.id, true);
    else state.comments = state.comments.filter((c) => tasks.some((t) => t.id === c.taskId));

    await refreshB();
  }

  // B 侧刷新：任何失败只标记离线，绝不向上抛——A 主链路不被 B 掉线拖垮。
  async function refreshB() {
    if (!state.session) { bState = bEmpty(); return; }
    try {
      const r = await bApi('GET', '/v1/notifications?unread=1');
      bState.online = true;
      bState.unread = r.data.notifications.length;
      if (purgeQueue.size) await drainPurgeQueue();
      if (ui.view === 'notifications') {
        const all = await bApi('GET', '/v1/notifications' + (ui.unreadOnly ? '?unread=1' : ''));
        bState.notifications = all.data.notifications;
      }
      if (ui.view === 'group' && ui.tab === 'time') {
        const a = selectedAssignment(ui.groupId);
        if (a) {
          // 旧演示作业未经 B commit，B 侧无里程碑、internal 两端点恒 404——2.5s 一轮的轮询
          // 会把控制台刷成一片红。commit 校验要求至少 1 个里程碑，故里程碑非空即 B 已登记
          // 该作业，可作为 internal 查询的前置条件。
          const ms = await bApi('GET', `/v1/assignments/${a.id}/milestones`).catch((e) => e);
          bState.milestones = ms.data ? ms.data.milestones : null;
          if (bState.milestones && bState.milestones.length) {
            const [jobs, cards] = await Promise.all([
              bApi('GET', `/v1/internal/reminder-jobs?assignmentId=${encodeURIComponent(a.id)}`).catch((e) => e),
              bApi('GET', `/v1/internal/yellow-cards?assignmentId=${encodeURIComponent(a.id)}`).catch((e) => e)
            ]);
            bState.jobs = jobs.data ? jobs.data.jobs : [];
            bState.cards = cards.data ? cards.data.cards : [];
          } else { bState.jobs = []; bState.cards = []; }
        } else { bState.milestones = null; bState.jobs = []; bState.cards = []; }
      }
    } catch (_) { bState.online = false; }
  }

  async function loadTaskDetail(tid, commentsOnly = false) {
    if (!commentsOnly) {
      const d = await api('GET', '/v1/tasks/' + tid);
      const t = state.tasks.find((x) => x.id === tid);
      if (t) {
        t.description = d.description || '';
        t.deliverableSpec = d.deliverableSpec || '';
        t.dependsOn = d.dependsOn || [];
        t.rejectReason = d.status === 'done' ? null : (d.rejectReason || null);
        t.rejected = !!d.rejected && d.status !== 'done';
      }
      const dl = await api('GET', `/v1/tasks/${tid}/deliverables`);
      state.deliverables = state.deliverables.filter((x) => x.taskId !== tid)
        .concat(dl.deliverables.map((x) => ({ ...x, createdAt: Date.parse(x.createdAt) })));
    }
    const cm = await api('GET', `/v1/tasks/${tid}/comments`);
    state.comments = state.comments.filter((c) => c.taskId !== tid).concat(cm.comments.map(commentFromApi));
  }

  /* ---------------- 工具 ---------------- */
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // 复制文本：原型以 file:// 打开时 Clipboard API 常被拒，且失败会消耗用户手势，
  // 故先走同步的 textarea + execCommand('copy')，再降级到 Clipboard API。
  async function copyText(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0';
      document.body.appendChild(ta);
      const sel = window.getSelection();
      const prev = sel && sel.rangeCount ? sel.getRangeAt(0) : null;
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      const ok = document.execCommand('copy');
      ta.remove();
      if (prev && sel) { sel.removeAllRanges(); sel.addRange(prev); }
      if (ok) return true;
    } catch (_) { /* 落到 Clipboard API */ }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (_) { /* 权限被拒 / 非安全上下文 */ }
    return false;
  }
  const user = (id) => id === 'system'
    ? { id, name: '系统', color: '#64748b' }
    : state.users.find((u) => u.id === id) || { id, name: '未知用户', color: '#9ca3af' };
  const group = (id) => state.groups.find((g) => g.id === id) || null;
  const task = (id) => state.tasks.find((t) => t.id === id) || null;
  const isLeader = (gid) => !!group(gid) && group(gid).ownerId === state.session;
  const memberIds = (gid) => state.members.filter((m) => m.groupId === gid).map((m) => m.userId);
  const taskDeliverables = (tid) => state.deliverables.filter((d) => d.taskId === tid).sort((a, b) => b.version - a.version);
  const latestDeliverable = (tid) => taskDeliverables(tid)[0] || null;
  const fmt = (v) => {
    if (!v) return '—';
    const d = new Date(v);
    return `${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  };
  // datetime-local 输入 ↔ ISO 契约（B 端点收 ISO 字符串）
  const toLocalInput = (iso) => {
    const d = new Date(iso);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  const fromLocalInput = (v) => new Date(v).toISOString();
  const defaultDdlInput = () => toLocalInput(new Date(Date.now() + 14 * 86400000).toISOString());
  function msPhase(due) {
    const left = Date.parse(due) - Date.now();
    if (left <= 0) return ['overdue', '已逾期'];
    if (left <= 24 * 3600000) return ['h24', '24h 内'];
    if (left <= 48 * 3600000) return ['h48', '48h 内'];
    return ['future', '未到期'];
  }
  // 小组可有多份作业（B 每次 commit 生成一份）；选中态驱动看板/审核/贡献/时间四个页签。
  function selectedAssignment(gid) {
    const list = state.assignments.filter((a) => a.groupId === gid);
    return list.find((a) => a.id === ui.assignmentId) || list[0] || null;
  }
  function bellBtn() {
    return `<button class="icon-btn" data-act="open-notifications" title="通知中心" aria-label="通知中心${bState.unread ? `，${bState.unread} 条未读` : ''}">🔔${bState.unread ? `<span class="nbadge" aria-hidden="true">${bState.unread > 99 ? '99+' : bState.unread}</span>` : ''}</button>`;
  }
  const isValidUrl = (v) => /^https?:\/\/[^\s]+$/i.test(String(v).trim());
  function urlType(url) {
    if (/docs\.qq\.com/i.test(url)) return '腾讯文档';
    if (/feishu\.cn/i.test(url)) return '飞书文档';
    if (/google\.com|docs\.google/i.test(url)) return 'Google Docs';
    if (/github\.com/i.test(url)) return 'GitHub';
    if (/wjx\.cn/i.test(url)) return '问卷星';
    if (/pan\.|drive|onedrive/i.test(url)) return '网盘';
    return '其他链接';
  }
  function toast(msg, kind = '') {
    const root = $('#toast-root');
    const el = document.createElement('div');
    el.className = 'toast ' + kind;
    el.textContent = msg;
    root.appendChild(el);
    while (root.children.length > 2) root.firstElementChild.remove();
    setTimeout(() => el.remove(), 2200);
  }
  /* ---------------- 渲染主入口 ---------------- */
  function render() {
    const app = $('#app');
    if (!state.session) {
      app.innerHTML = renderLogin();

      app.innerHTML = renderGroups();
    } else if (ui.view === 'group') {
      app.innerHTML = renderGroup();
    } else if (ui.view === 'notifications') {
      app.innerHTML = renderNotifications();
    } else if (ui.view === 'settings') {
      app.innerHTML = renderSettings();
    } else if (ui.view === 'wizard') {
      app.innerHTML = renderWizard();
    } else if (ui.view === 'confirm') {
      app.innerHTML = renderConfirm();
    } else {
      app.innerHTML = renderGroups();
      ui.view = 'groups';
    }
    renderModal();
    associateFieldLabels(document);
  }

  // 视觉上有 label、语义上没有关联的输入框，补齐 label/for，点标签也能聚焦输入框。
  let fieldSeq = 0;
  function associateFieldLabels(root) {
    root.querySelectorAll('.field > label').forEach((lab) => {
      if (lab.htmlFor) return;
      const ctl = lab.parentElement.querySelector('input, textarea, select');
      if (!ctl) return;
      if (!ctl.id) ctl.id = 'field-' + (++fieldSeq);
      lab.htmlFor = ctl.id;
    });
  }

  function appBar(title, right = '', back = false) {
    return `<div class="app-bar">
      ${back ? `<button class="icon-btn" data-act="${back === 'group' ? 'back-group' : 'back-groups'}" aria-label="返回">‹</button>` : `<div class="brand"><div class="brand-mark">鸽</div></div>`}
      <h1>${esc(title)}${back ? '<div class="sub">别鸽了 · 组队协作 × 智能时间</div>' : ''}</h1>
      ${right}
    </div>`;
  }

  /* ---------------- F1 登录 ---------------- */
  /* ---------------- 注册 / 登录页（F1） ---------------- */
  function renderLogin() {

    <div class="screen">
      ${bState.online === false ? `<div class="b-offline">智能提醒服务暂时不可用：AI 拆解、提醒与通知可能受影响，小组协作不受影响。</div>` : ''}
      <div class="card tight">

        ${userSwitch()}

      ${pending.length ? `<div class="card tight" style="border-color:#c7d2fe">
        <div class="block-title"><span>待组长确认的入组申请</span></div>
        ${pending.map((p) => `<div class="pending-row"><span class="who">申请加入「${esc(p.groupName || group(p.groupId)?.name || p.groupId)}」</span><span class="muted">${fmt(p.ts)}</span></div>`).join('')}

      ${myGroups.length ? myGroups.map((g) => {
        const ids = memberIds(g.id);

  /* ---------------- 小组页 ---------------- */
  function renderGroup() {

    const done = tasks.filter((t) => t.status === 'done').length;
    // 审核是组长职权：组员端整个页签不出现；切换身份后仍停在审核页则退回看板
    const leader = isLeader(g.id);
    if (ui.tab === 'review' && !leader) ui.tab = 'board';
    const tabs = [['board', '看板'], ...(leader ? [['review', '审核']] : []), ['contrib', '贡献'], ['time', '时间'], ['events', '记录'], ['members', '成员']];
    return `${appBar(g.name, `${bellBtn()}<button class="icon-btn" data-act="invite-open" title="邀请" aria-label="邀请成员">＋</button>`, true)}

      <div class="card tight">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">

  /* ---------------- F9 看板 ---------------- */
  function renderBoard(tasks, g) {
    if (!tasks.length && g && !selectedAssignment(g.id)) {
      return `<div class="empty"><span class="big">▤</span>该小组还没有作业<br>${isLeader(g.id) ? '用模板或 AI 拆解，5 分钟把作业拆成看板任务' : '等待组长用模板 / AI 拆解创建作业'}</div>

      ['todo', '待办'], ['doing', '进行中'], ['review', '待审核'], ['done', '已完成']
    ];
    return `<div class="board">${cols.map(([key, label]) => {
      const list = tasks.filter((t) => (key === 'todo' ? (t.status === 'unclaimed' || t.status === 'todo') : t.status === key));

  }
  function renderTaskCard(t) {
    const unclaimed = t.status === 'unclaimed';
    const overdue = t.status !== 'done' && Date.parse(t.due) < Date.now();
    const dl = latestDeliverable(t.id);
    return `<div class="task-card ${unclaimed ? 'unclaimed' : ''}" data-act="open-task" data-id="${t.id}" role="button" tabindex="0" aria-label="${esc(t.title)}，${esc(STATUS[t.status] || '')}${t.assigneeId ? `，负责人${esc(user(t.assigneeId).name)}` : ''}，截止 ${fmt(t.due)}">
      <div class="title">${esc(t.title)}</div>

        ${t.assigneeId ? `<span class="avatar sm" style="background:${user(t.assigneeId).color}">${esc(user(t.assigneeId).name[0])}</span>` : `<span class="tag claimed">未认领</span>`}
        <span class="due ${overdue ? 'overdue' : ''}">${overdue ? '逾期 · ' : ''}${fmt(t.due)}</span>

  /* ---------------- F21 审核队列（仅组长可见） ---------------- */
  function renderReview(tasks) {
    const list = tasks.filter((t) => t.status === 'review');
    return `<div class="section-title"><h2>待我审核（${list.length}）</h2><span class="muted">组长职权 · 组员端无此页</span></div>

        ${dl ? `<a class="deliverable" href="${esc(dl.url)}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">
          <span class="favicon">${esc(dl.type[0])}</span><span class="info"><strong>${esc(dl.title)}</strong><span>${esc(dl.type)} · 点击查看</span></span><span>↗</span>
