<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小组作业 · 提醒与订阅设置</title>
<link rel="stylesheet" href="/h5/style.css">
</head>
<body>
<nav class="nav">
  <a href="/h5/">建作业</a><a href="/h5/timeline.html">时间线</a><a href="/h5/notifications.html">通知</a><a class="active" href="/h5/settings.html">设置</a>
</nav>
<h1>提醒与订阅设置</h1>

<div class="card">
  <h2>通道偏好</h2>
  <label class="chk"><input type="checkbox" id="ch-inapp" checked disabled> 站内信（必发，不可关）</label>
  <label class="chk"><input type="checkbox" id="ch-email"> 邮件兜底（有邮箱时发送）</label>
  <label class="chk"><input type="checkbox" id="ch-wechat" disabled> 微信订阅消息（服务端开关；H5 无法收集额度，见 R3 报告）</label>
  <button id="save" style="margin-top:10px">保存偏好</button>
  <div class="muted">MVP 偏好存本机浏览器；接真后迁服务端。</div>
</div>

<div class="card">
  <h2>微信订阅额度</h2>
  <div class="muted" id="quota">额度加载中…</div>
  <p class="yc-body" style="margin-top:8px">一次性订阅消息：每次打开小程序按引导续订攒额度；额度不足自动降级邮件 + 站内，提醒不丢。H5 网页无法调起微信授权（R3），续订请在小程序壳内完成。</p>
  <button id="renew" class="ghost" disabled>去续订（待小程序壳）</button>
</div>

<script type="module">
import { toast, bApi, getToken, fmtLocal } from '/h5/lib/api.js';
const $ = (id) => document.getElementById(id);
const KEY = 'b-h5-prefs';
const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
const prefs = read();
$('ch-email').checked = prefs.email !== false;
$('save').addEventListener('click', () => {
  localStorage.setItem(KEY, JSON.stringify({ email: $('ch-email').checked }));
  toast('偏好已保存（本机）', 'ok');
});
(async () => {
  if (!getToken()) { $('quota').textContent = '登录后可查看额度'; return; }
  try {
    const { body } = await bApi('GET', '/v1/subscriptions/quota');
    $('ch-wechat').checked = body.wechatEnabled;
    const parts = [`剩余额度：${body.remaining} 条`];
    if (body.collectedAt) parts.push(`最近续订：${fmtLocal(body.collectedAt)}`);
    parts.push(body.wechatEnabled ? '微信通道：开' : '微信通道：关（降级邮件+站内）');
    $('quota').textContent = parts.join(' · ');
  } catch { $('quota').textContent = '额度读取失败，请刷新重试'; }
})();
</script>
</body>
</html>
