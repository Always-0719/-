openapi: 3.0.3
info:
  title: 别鸽了 · 小组作业协作层 API
  version: 1.0.0
  description: |
    三线（A 组队与协作 / B 智能与时间 / C 证据与评价）合并后的端点全集，共 66 条：
    e2e mock 实现 56 条 + 真 B 服务独占 10 条（含 /healthz）。按**现网实现**定形，不是目标设计。

    ## 实现落点
    - `x-implemented-by: [mock]` —— 只有 e2e/mock/server.js 实现（真 A / 真 C 服务尚未落地）。
    - `x-implemented-by: [mock, b-time]` —— mock 与 services/b-time 都实现；两者语义有差异时在该端点
      description 里逐条写明，**差异未收敛前不得视为同一契约**。
    - `x-implemented-by: [b-time]` —— 只有真 B 实现，纯 mock 模式下对应 e2e 条件 skip。

    ## provisional 标记
    `x-provisional: true` 的端点没有任何契约来源：A-组队与协作-PRD.md §5.1「本线提供（v1 冻结）」
    未定义它们（该 PRD 位于仓库外，本轮已逐条核对）。它们是合并时为了让 A 原型「全功能接真」而发明的形状，
    真 A 后端落地后很可能不一致而要返工。会签时要么追认形状、要么给出真形状。
    清单与代价见 docs/merge-v1.1-signoff.md §2。

    ## 已声明但未实现（不在本文件 paths 内，属契约缺口）
    - `WS /v1/ws`（A-PRD §5.1）：评论与任务状态推送，无实现。
    - `GET /v1/teacher/assignments/{aid}/timeline`、`POST /v1/teacher/assignments/{aid}/grants`
      （C-PRD §4.1，标注「预留 · P2 · 本次不实现」）：教师视角，无实现。
    - `POST /v1/events` 在 mock 侧不校验 type 与载荷形状（Event schema 由消费方与 e2e 守），
      真 C 落地时须在入口按 packages/contracts/event.v1.schema.json 校验。

    ## 冻结载荷
    TaskDraft v1 与 Event v1 的规范形状以同目录 JSON Schema 为准（本文件用 $ref 引用）：
    - taskdraft.v1.schema.json（canonical owner = B）
    - event.v1.schema.json（canonical owner = C）
servers:
  - url: http://127.0.0.1:8787
    description: e2e mock（A/B/C 共用基座，MOCK_PORT 可改）
  - url: http://127.0.0.1:8788
    description: 真 B 服务 b-time（B_PORT 可改；同时托管 /h5 静态页与 /dev/a 代理）
tags:
  - name: auth
    description: 登录与会话（A）
  - name: group
    description: 组队、邀请、成员管理（A）
  - name: draft
    description: 模板 / AI 拆解 / 草稿 / 里程碑（B）
  - name: board
    description: 看板与任务状态机、交付物、评论、审核、统一提交（A）
  - name: evidence
    description: Event 账本、时间线、统计、互评、报告（C）
  - name: internal
    description: 服务间调用（MVP 仅内网可达，多数免应用层鉴权）
  - name: notify
    description: 站内通知与微信订阅配额（B）
  - name: ops
    description: 健康检查与观测（B）
security:
  - bearerAuth: []
paths:
  /v1/auth/wechat-login:
    post:
      tags: [auth]
      summary: 微信小程序一键授权登录
      description: |
        mock：code 命中种子用户 wxOpenid 时复用其固定 userId（供原型切换演示角色），
        否则 userId = `u-${code}`、token = `tok-${code}`。无真实微信校验。
        真 B 不实现此端点；H5 经 `/dev/a` 代理转发到 mock。
      x-owner: A
      x-implemented-by: [mock]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: wx.login 的 code；mock 下任意非空字符串即可登录 }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/auth/email-code:
    post:
      tags: [auth]
      summary: 下发邮箱验证码
      description: |
        mock 把验证码回显在 `devCode` 里仅供演示；真实环境验证码只进邮件，绝不出响应体。
        x-prd-gap：A-PRD F1 要求「邮箱验证码 60s 限频」，mock 未实现。
      x-owner: A
      x-implemented-by: [mock]
      x-prd-gap: 60s 限频未实现；devCode 回显仅限演示
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: 已下发
          content:
            application/json:
              schema:
                type: object
                required: [sent, devCode]
                properties:
                  sent: { type: boolean }
                  devCode: { type: string, description: 仅 mock 演示回显 }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/auth/email-login:
    post:
      tags: [auth]
      summary: 邮箱登录（微信外 H5 兜底）
      description: |
        `code` 可选：既有 e2e 只传 email 直登；传 code 时按已下发的演示验证码校验。
        userId 优先复用同 email 的既有 profile，否则 `u-${email}`。
      x-owner: A
      x-implemented-by: [mock]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                code: { type: string }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/users:
    get:
      tags: [auth]
      summary: 演示身份目录（登录前可渲染「点击直接切换」）
      description: |
        **public 免鉴权**，返回全员 profile（含 email）。演示可接受，上线前必须去掉或加 internal 鉴权。
      x-owner: A
      x-implemented-by: [mock]
      x-provisional: true
      x-provisional-reason: A-PRD §5.1 未定义；为 A 原型登录页账号目录 / @提及 / 成员昵称而发明
      security: []
      responses:
        '200':
          description: 用户目录
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/Profile' }
  /v1/demo/reset:
    post:
      tags: [auth]
      summary: 清空内存库并重新播种演示数据
      description: '**public 免鉴权**，任何人可清库。上线前必须去掉或加鉴权。'
      x-owner: A
      x-implemented-by: [mock]
      x-provisional: true
      x-provisional-reason: A-PRD §5.1 未定义；为 A 原型「重置演示数据」按钮而发明
      security: []
      responses:
        '200':
          description: 已重置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
  /v1/groups:
    post:
      tags: [group]
      summary: 建组
      description: |
        建组者即组长并自动入组。`joinNeedConfirm` 缺省 true（`!== false`），`memberLimit` 缺省 8。
        不写 Event：冻结 18 类无 group_create，按裁定丢弃并登记会签。
        mock 不校验 name 非空。
      x-owner: A
      x-implemented-by: [mock]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                course: { type: string, nullable: true }
                memberLimit: { type: integer, default: 8 }
                color: { type: string, description: 缺省按调色板轮转 }
                joinNeedConfirm: { type: boolean, default: true }
      responses:
        '201':
          description: 建组成功
          content:
            application/json:
              schema:
                type: object
                required: [id, name, ownerId]
                properties:
                  id: { type: string }
                  name: { type: string }
                  ownerId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [group]
      summary: 我的组列表
      description: 只返回本人所在组（不是全量目录），与 `GET /v1/groups/{gid}` 的「非成员 403」配套。
      x-owner: A
      x-implemented-by: [mock]
      x-provisional: true
      x-provisional-reason: A-PRD §5.1 只定义 POST /v1/groups 与 GET /v1/groups/{gid}；首页小组列表入口为本轮发明
      responses:
        '200':
          description: 组列表
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: { $ref: '#/components/schemas/GroupSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/groups/{gid}:
    parameters:
      - { $ref: '#/components/parameters/gid' }
    get:
      tags: [group]
      summary: 组详情
      description: 非成员 403，组不存在 404（两者可区分）。真 B 的 assertLeader 消费此端点判定组长。
      x-owner: A
      x-implemented-by: [mock]
      responses:
        '200':
          description: 组详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/groups/{gid}/settings:
    parameters:
      - { $ref: '#/components/parameters/gid' }
    put:
      tags: [group]
      summary: 改组设置（组长 only）
      description: |
        可改 `joinNeedConfirm / course / name / memberLimit`。
        `memberLimit` 须为 ≥当前人数 且 ≤30 的整数；`name` 去空白后不得为空。
      x-owner: A
      x-implemented-by: [mock]
      x-provisional: true
      x-provisional-reason: A-PRD §5.1 未定义；为 A 原型组设置弹窗而发明
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                course: { type: string, nullable: true }
                memberLimit: { type: integer, minimum: 1, maximum: 30 }
                joinNeedConfirm: { type: boolean }
      responses:
        '200':
          description: 更新后的设置
          content:
            application/json:
              schema:
                type: object
                required: [id, name, memberLimit, joinNeedConfirm]
                properties:
                  id: { type: string }
                  name: { type: string }
                  course: { type: string, nullable: true }
                  memberLimit: { type: integer }
                  joinNeedConfirm: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/groups/{gid}/invites:
    parameters:
      - { $ref: '#/components/parameters/gid' }
    post:
      tags: [group]
      summary: 生成邀请码（组长 only）
      description: |
        6 位大写码，有效期 7 天。**生成新码即作废旧码**（A 原型成员页文案如此承诺）。
        不写 Event：冻结 18 类无 invite_create，按裁定丢弃并登记会签。
        组不存在与非组长同为 403。
      x-owner: A
      x-implemented-by: [mock]
      responses:
        '201':
          description: 新邀请码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [group]
      summary: 邀请码列表（成员可读）
      description: 只返回 active 且未过期的码。
      x-owner: A
      x-implemented-by: [mock]
      x-provisional: true
      x-provisional-reason: A-PRD §5.1 只定义 POST invites；列表与轮换读取面为本轮发明
      responses:
        '200':
          description: 邀请码列表
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items: { $ref: '#/components/schemas/Invite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/invites/{code}/join:
    parameters:
      - name: code
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [group]
      summary: 凭邀请码加入
      description: |
        免确认组：直接入组并写 `member_join`（objectRef.kind=group，assignmentId=null）。
        需确认组：登记 pending 申请，返回 202，不入组、不写事件。
        判定顺序：码失效/不存在 404 → 已是成员 409 → 满员 409 → 免确认 200 / 需确认 202。
      x-owner: A
      x-implemented-by: [mock]
      responses:
        '200':
          description: 已入组
          content:
            application/json:
              schema:
                type: object
                required: [joined, groupId]
                properties:
                  joined: { type: boolean }
                  groupId: { type: string }
        '202':
          description: 待组长确认
          content:
            application/json:
              schema:
                type: object
                required: [groupId, status]
                properties:
                  groupId: { type: string }
                  status: { type: string, enum: [pending_leader_approval] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/groups/{gid}/join-requests/{uid}/approve:
    parameters:
      - { $ref: '#/components/parameters/gid' }
      - { $ref: '#/components/parameters/uid' }
    post:
      tags: [group]
      summary: 批准入组申请（组长 only）
      description: 成功后写 `member_join`（actorId 为被批准人）。无 pending 申请 404；满员 409。
      x-owner: A
      x-implemented-by: [mock]
      x-provisional: true
      x-provisional-reason: |
        A-PRD F2 有「加入默认需组长确认」的功能要求，但 §5.1 未定义批准端点。
        会签清单 §2 原列 14 条时漏计此条，本轮补标（第 15 条）。
      responses:
        '200':
          description: 已批准
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinRequestDecision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/groups/{gid}/join-requests/{uid}/deny:
    parameters:
      - { $ref: '#/components/parameters/gid' }
      - { $ref: '#/components/parameters/uid' }
    post:
      tags: [group]
      summary: 拒绝入组申请（组长 only）
      description: 不写 Event（冻结 18 类无对应类型）。
      x-owner: A
      x-implemented-by: [mock]
      x-provisional: true
      x-provisional-reason: A-PRD §5.1 未定义；为 A 原型拒绝按钮而发明
      responses:
        '200':
          description: 已拒绝
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinRequestDecision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/groups/{gid}/join-requests:
    parameters:
      - { $ref: '#/components/parameters/gid' }
    get:
      tags: [group]
      summary: 待审申请列表（组长视角）
      x-owner: A
      x-implemented-by: [mock]
      x-provisional: true
      x-provisional-reason: A-PRD §5.1 未定义；为 A 原型待审列表而发明
      responses:
        '200':
          description: 待审列表
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items: { $ref: '#/components/schemas/JoinRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/join-requests/mine:
    get:
      tags: [group]
      summary: 我的待审申请（首页「待组长确认」卡片）
      x-owner: A
      x-implemented-by: [mock]
      x-provisional: true
      x-provisional-reason: A-PRD §5.1 未定义；为 A 原型首页卡片而发明
      responses:
        '200':
          description: 本人 pending 申请
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/JoinRequest' }
                        - type: object
                          properties:
                            groupName: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/groups/{gid}/exit:
    parameters:
      - { $ref: '#/components/parameters/gid' }
    post:
      tags: [group]
      summary: 自愿退组
      description: 写 `member_exit`。组长退组 409「须先转让才能退组」（A-PRD F2 要求留痕与转让）。
      x-owner: A
      x-implemented-by: [mock]
      x-provisional: true
      x-provisional-reason: A-PRD F2 有功能要求但 §5.1 未定义端点；为 A 原型退组按钮而发明
      responses:
        '200':
          description: 已退组
          content:
            application/json:
              schema:
                type: object
                required: [groupId, userId, exited]
                properties:
                  groupId: { type: string }
                  userId: { type: string }
                  exited: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/groups/{gid}/transfer:
    parameters:
      - { $ref: '#/components/parameters/gid' }
    post:
      tags: [group]
      summary: 转让组长（组长 only）
      description: |
        `toUserId` 须为组内成员；转给自己 409「已是组长」。
        **不入账**：冻结 18 类无 group_transfer，与 group_create/invite_create 同批会签。
      x-owner: A
      x-implemented-by: [mock]
      x-provisional: true
      x-provisional-reason: A-PRD F2 有「组长可转让」功能要求但 §5.1 未定义端点
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toUserId]
              properties:
                toUserId: { type: string }
      responses:
        '200':
          description: 已转让
          content:
            application/json:
              schema:
                type: object
                required: [groupId, ownerId]
                properties:
                  groupId: { type: string }
                  ownerId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/groups/{gid}/assignments:
    parameters:
      - { $ref: '#/components/parameters/gid' }
    get:
      tags: [group]
      summary: 组下作业列表（成员可读）
      description: A 原型由组进入作业的唯一入口。作业数据记录系统归属（A 还是 B）待 v1.1 会签。
      x-owner: A
      x-implemented-by: [mock]
      x-provisional: true
      x-provisional-reason: A-PRD §5.1 未定义；缺它则原型渲染不出任何作业
      responses:
        '200':
          description: 作业列表
          content:
            application/json:
              schema:
                type: object
                required: [assignments]
                properties:
                  assignments:
                    type: array
                    items: { $ref: '#/components/schemas/AssignmentRef' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/assignments/ai-draft:
    post:
      tags: [draft]
      summary: AI 拆解作业要求为 TaskDraft v1
      description: |
        链路：脱敏 → 缓存命中判定 → 成本上限 → provider 两次尝试 → TaskDraft 校验 → 失败降级模板。
        **降级/缓存标记走响应头**（TaskDraft v1 顶层 additionalProperties=false，body 保持纯契约形状）。

        mock 与真 B 的差异（未收敛）：
