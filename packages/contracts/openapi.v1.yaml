          description: 黄牌
          content:
            application/json:
              schema:
                type: object
                required: [cards]
                properties:
                  cards:
                    type: array
                    items: { $ref: '#/components/schemas/YellowCard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/internal/subscribe-quota:
    get:
      tags: [internal]
      summary: 指定用户的微信订阅配额观测
      description: 真 B 独占。无记录时 remaining=0、collectedAt/openid 为 null。
      x-owner: B
      x-implemented-by: [b-time]
      security: []
      parameters:
        - name: userId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 配额
          content:
            application/json:
              schema:
                type: object
                required: [quota]
                properties:
                  quota:
                    type: object
                    required: [userId, remaining]
                    properties:
                      userId: { type: string }
                      remaining: { type: integer }
                      collectedAt: { type: string, nullable: true }
                      openid: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/internal/schedule/tick:
    post:
      tags: [internal]
      summary: 手动补扫（幂等，gate2 确定性触发）
      description: |
        真 B 独占。物化提醒 job → 下发 pending → 黄牌扫描，不等 60s 定时 tick。
        dispatched / yellowcards 在无对应服务时为 null。
      x-owner: B
      x-implemented-by: [b-time]
      security: []
      responses:
        '200':
          description: 补扫结果
          content:
            application/json:
              schema:
                type: object
                required: [ok, at, created]
                properties:
                  ok: { type: boolean }
                  at: { type: string, format: date-time }
                  created: { type: integer }
                  dispatched:
                    type: object
                    nullable: true
                    properties:
                      sent: { type: integer }
                      failed: { type: integer }
                      pending: { type: integer }
                  yellowcards:
                    type: object
                    nullable: true
                    properties:
                      created: { type: integer }
                      events: { type: integer }
                      leaderNotes: { type: integer }
                      skipped: { type: integer }
  /v1/internal/metrics:
    get:
      tags: [ops]
      summary: B 线内指标（全部由 owned 表现算，无额外上报链路）
      description: |
        真 B 独占。触发误差 = sent_at − max(fire_at, created_at)：补扫 job 以物化时刻为基准，
        否则历史积压会被误算成调度抖动（PRD 验收口径是队列调度误差 <5min）。
        分母为 0 时比率取 null（不是 0）。
      x-owner: B
      x-implemented-by: [b-time]
      security: []
      responses:
        '200':
          description: 指标快照
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Metrics' }
  /v1/notifications:
    get:
      tags: [notify]
      summary: 我的站内通知（最近 100 条，倒序）
      description: 真 B 独占。type ∈ reminder / yellow_card_self / yellow_card_leader / mention / reject。
      x-owner: B
      x-implemented-by: [b-time]
      parameters:
        - name: unread
          in: query
          required: false
          description: 传 '1' 只返回未读
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: 通知列表
          content:
            application/json:
              schema:
                type: object
                required: [notifications]
                properties:
                  notifications:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/notifications/{nid}/read:
    parameters:
      - { $ref: '#/components/parameters/nid' }
    post:
      tags: [notify]
      summary: 标记已读（幂等）
      description: 真 B 独占。非本人通知与不存在同为 404（不泄漏他人通知是否存在）。已读时保留原 read_at。
      x-owner: B
      x-implemented-by: [b-time]
      responses:
        '200':
          description: 通知（带 read_at）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/subscriptions/collect:
    post:
      tags: [notify]
      summary: 上报微信订阅授权次数
      description: |
        真 B 独占。小程序壳在 wx.requestSubscribeMessage 授权回调后上报；H5 无此能力（R3），端点先建。
        count 缺省 1，须为 1..3 整数；累加到 remaining。openid 可选（≤128 非空字符串）。
      x-owner: B
      x-implemented-by: [b-time]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                count: { type: integer, minimum: 1, maximum: 3, default: 1 }
                openid: { type: string, maxLength: 128 }
      responses:
        '200':
          description: 累加后的配额
          content:
            application/json:
              schema:
                type: object
                required: [ok, remaining, collectedAt]
                properties:
                  ok: { type: boolean }
                  remaining: { type: integer }
                  collectedAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/subscriptions/quota:
    get:
      tags: [notify]
      summary: 我的订阅配额
      description: 真 B 独占。`wechatEnabled` 取自 WECHAT_ENABLED 环境变量，供前端决定是否展示授权入口。
      x-owner: B
      x-implemented-by: [b-time]
      responses:
        '200':
          description: 配额
          content:
            application/json:
              schema:
                type: object
                required: [remaining, wechatEnabled]
                properties:
                  remaining: { type: integer }
                  collectedAt: { type: string, nullable: true }
                  wechatEnabled: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /healthz:
    get:
      tags: [ops]
      summary: 健康检查（public）
      description: 真 B 独占；mock 无此端点（探活用 public 的 GET /v1/users）。
      x-owner: B
      x-implemented-by: [b-time]
      security: []
      responses:
        '200':
          description: 存活
          content:
            application/json:
              schema:
                type: object
                required: [ok, service]
                properties:
                  ok: { type: boolean }
                  service: { type: string, enum: [b-time] }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <token>`。mock 会话为 `tok-${code}`；
        真 B 由 SESSION_MODE 决定（mock 会话 / jwt），internal 与 public 端点不校验。
  parameters:
    gid:
      name: gid
      in: path
      required: true
      schema: { type: string }
    uid:
      name: uid
      in: path
      required: true
      schema: { type: string }
    aid:
      name: aid
      in: path
      required: true
      description: 真 B 的 aid 由 draftId 派生（`a-${draftId}`）；mock 为随机 uuid
      schema: { type: string }
    tid:
      name: tid
      in: path
      required: true
      schema: { type: string }
    cid:
      name: cid
      in: path
      required: true
      schema: { type: string }
    did:
      name: did
      in: path
      required: true
      schema: { type: string }
    rid:
      name: rid
      in: path
      required: true
      schema: { type: string }
    nid:
      name: nid
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: 参数或载荷校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 缺失或无效会话
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 越权（非成员 / 非组长 / 非作者 / 非负责人）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 对象不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 状态冲突（已被认领 / 满员 / 已编辑 / 窗口未开或已截止 / 重复提交等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadGateway:
      description: 上游（A 服务）不可用或返回非预期状态；本地已回滚，可重试
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    ValidationErrors:
      type: object
      required: [error]
      properties:
        error: { type: string }
        errors: { type: array, items: { type: string } }
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    Session:
      type: object
      required: [token, userId]
      properties:
        token: { type: string }
        userId: { type: string }
    Profile:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string }
        email: { type: string, nullable: true }
        wxOpenid: { type: string, nullable: true }
    GroupSummary:
      type: object
      required: [id, name, ownerId, memberLimit, joinNeedConfirm, members, taskCount]
      properties:
        id: { type: string }
        name: { type: string }
        course: { type: string, nullable: true }
        color: { type: string, nullable: true }
        ownerId: { type: string }
        memberLimit: { type: integer }
        joinNeedConfirm: { type: boolean }
        members: { type: array, items: { type: string } }
        taskCount: { type: integer }
    GroupDetail:
      type: object
      required: [id, name, ownerId, members, memberLimit, joinNeedConfirm]
      description: 真 B 的 assertLeader 只依赖 ownerId 与 members；members 为 uid 数组（无昵称）
      properties:
        id: { type: string }
        name: { type: string }
        ownerId: { type: string }
        members: { type: array, items: { type: string } }
