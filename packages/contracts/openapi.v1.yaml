        body: { type: string }
        object_kind: { type: string, nullable: true }
        object_id: { type: string, nullable: true }
        job_id: { type: string, nullable: true }
        event_id: { type: string, nullable: true }
        read_at: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    Metrics:
      type: object
      required: [generatedAt, assignments, aiDrafts, reminders, reminderNotes, draftCommit]
      properties:
        generatedAt: { type: string, format: date-time }
        assignments:
          type: object
          properties:
            total: { type: integer }
            bySource:
              type: object
              properties:
                template: { type: integer }
                ai: { type: integer }
                manual: { type: integer }
            templateAiRate: { type: number, nullable: true }
        aiDrafts:
          type: object
          properties:
            calls: { type: integer }
            degraded: { type: integer }
            degradedRate: { type: number, nullable: true }
            cached: { type: integer }
        reminders:
          type: object
          properties:
            sent: { type: integer }
            pending: { type: integer }
            failed: { type: integer }
            avgDelaySec: { type: number, nullable: true }
            maxDelaySec: { type: number, nullable: true }
        reminderNotes:
          type: object
          properties:
            total: { type: integer }
            read: { type: integer }
            openRate: { type: number, nullable: true }
        draftCommit:
          type: object
          properties:
            committed: { type: integer }
            avgSec: { type: number, nullable: true }
            maxSec: { type: number, nullable: true }